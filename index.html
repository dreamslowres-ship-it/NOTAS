<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<title>Notas</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <button class="icon-btn" id="btnDrawer" aria-label="Panel" type="button"></button>
    <h1 id="title"><span id="titleMain">Notas</span><span class="crumb hidden" id="titleCrumb"></span><span class="count" id="count">0</span></h1>
    <button class="icon-btn" id="btnSearch" aria-label="Buscar" title="Buscar (/)" type="button"></button>
    <button class="icon-btn" id="btnMenu" aria-label="Opciones" type="button"></button>
  </div>

  <div class="searchbar hidden" id="searchbar" role="search">
    <span id="searchIcon" aria-hidden="true"></span>
    <input id="searchInput" type="search" placeholder="Buscar notas…" autocomplete="off" spellcheck="false" aria-label="Buscar notas">
    <button class="icon-btn" id="btnSearchSave" style="width:32px;height:32px" title="Guardar como colección" aria-label="Guardar como colección" type="button"></button>
    <button class="icon-btn" id="btnSearchClose" style="width:32px;height:32px" aria-label="Cerrar búsqueda" type="button"></button>
  </div>

  <div class="chips" id="chips" role="tablist"></div>
  <div class="list" id="list"></div>
  <button class="fab" id="fab" aria-label="Nueva nota (mantén pulsado para plantillas)" type="button"></button>
</div>

<div class="editor" id="editor" role="dialog" aria-modal="true" aria-label="Editor de nota">
  <div class="ed-bar" id="edBar">
    <button class="icon-btn" id="edBack" aria-label="Volver" type="button"></button>
    <div class="spacer"></div>
    <button type="button" class="ed-mode-btn" id="edModeBtn" aria-label="Modo de edición. Toca para ciclar, mantén pulsado para elegir" aria-haspopup="menu">Fuente</button>
    <button class="icon-btn" id="edPin" aria-label="Fijar nota" type="button"></button>
    <button class="icon-btn" id="edColor" aria-label="Color de la nota" type="button"></button>
    <button class="icon-btn" id="edMore" aria-label="Más opciones" type="button"></button>
  </div>
  <div class="ed-scroll" id="edScroll">
    <div class="ed-meta" id="edMeta" aria-hidden="true"></div>
    <input class="ed-title" id="edTitle" type="text" placeholder="Título" autocomplete="off" spellcheck="false" aria-label="Título de la nota">
    <div class="ed-tags-box collapsed" id="edTagsBox">
      <div class="ed-tags-head" id="edTagsHead" role="button" tabindex="0" aria-expanded="false" aria-controls="edTagsBody">
        <span>Etiquetas</span>
        <span id="edTagsCount" style="font-weight:600;text-transform:none;letter-spacing:0;opacity:.8"></span>
        <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </div>
      <div class="ed-tags-body" id="edTagsBody">
        <div id="edTagsList"></div>
        <input class="ed-tag-input" id="edTagInput" type="text" placeholder="Añadir etiqueta…" autocomplete="off" spellcheck="false" aria-label="Añadir etiqueta">
      </div>
    </div>
    <div class="ed-body-wrap" id="edBodyWrap">
      <div class="ed-preview hidden" id="edPreview" aria-live="polite"></div>
      <div class="ed-live hidden" id="edLive"></div>
      <textarea class="ed-text" id="edText" placeholder="Escribe…&#10;&#10;- [ ] tarea · **negrita** · ## título · > cita · | tabla |" spellcheck="false" aria-label="Contenido de la nota"></textarea>
    </div>
  </div>
  <div class="ed-fmt" id="edFmt" role="toolbar" aria-label="Insertar formato">
    <button type="button" data-fmt="task" title="Tarea" aria-label="Insertar tarea"></button>
    <button type="button" data-fmt="ul" title="Lista" aria-label="Insertar lista"></button>
    <button type="button" data-fmt="h2" title="Título" aria-label="Insertar título"></button>
    <button type="button" data-fmt="quote" title="Cita" aria-label="Insertar cita"></button>
    <button type="button" data-fmt="hr" title="Separador" aria-label="Insertar separador"></button>
    <button type="button" data-fmt="table" title="Tabla" aria-label="Insertar tabla"></button>
    <button type="button" data-fmt="code" title="Código" aria-label="Insertar bloque de código"></button>
  </div>
  <div class="ed-foot">
    <div class="tag-auto" id="tagAuto" role="listbox" aria-label="Sugerencias de etiquetas"></div>
    <div class="ed-tags" id="edTags"></div>
    <div class="ed-status" id="edStatus" role="status" aria-live="polite"></div>
  </div>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-grip" aria-hidden="true"></div><div id="sheetBody"></div></div>

<div class="drawer-scrim" id="drawerScrim" aria-hidden="true"></div>
<aside class="drawer" id="drawer" aria-label="Panel de navegación">
  <div class="drawer-head"><h2 id="drawerTitle">Panel</h2></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn" type="button"></button></div>
<input type="file" id="fileInput" accept="application/json" class="hidden">

<script src="app.js" defer></script>
</body>
</html>
